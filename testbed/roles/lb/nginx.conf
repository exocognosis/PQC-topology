# Internal load balancer. Listener accepts only TLS 1.2 with RSA key transport
# (AES256-GCM-SHA384): no forward secrecy, Shor-vulnerable.
# Upstream to appa: TLS 1.3, X25519 only, mutual TLS.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /run-out/error.log warn;
events { worker_connections 256; }
http {
  log_format tlsinfo '$time_iso8601 $remote_addr $server_port $ssl_protocol $ssl_cipher $ssl_curve $status "$request"';
  access_log /run-out/access.log tlsinfo;
  server {
    listen 8443 ssl;
    server_name lb;
    ssl_certificate     /pki/lb.chain.pem;
    ssl_certificate_key /pki/lb.key;
    ssl_protocols TLSv1.2;
    ssl_ciphers AES256-GCM-SHA384;
    location / {
      proxy_pass https://appa:9443;
      proxy_ssl_server_name on;
      proxy_ssl_name appa;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 2;
      proxy_ssl_trusted_certificate /pki/root-rsa.pem;
      proxy_ssl_certificate     /pki/lb-client.chain.pem;
      proxy_ssl_certificate_key /pki/lb-client.key;
      proxy_ssl_protocols TLSv1.3;
      proxy_ssl_conf_command Groups X25519;
    }
  }
}
