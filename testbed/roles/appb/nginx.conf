# Application service B (holds the "profile" data class). Mutual TLS,
# TLS 1.3, X25519 only. /callback calls back into appa, closing a cycle.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /run-out/error.log warn;
events { worker_connections 256; }
http {
  log_format tlsinfo '$time_iso8601 $remote_addr $server_port $ssl_protocol $ssl_cipher $ssl_curve $status "$request"';
  access_log /run-out/access.log tlsinfo;
  server {
    listen 9444 ssl;
    server_name appb;
    ssl_certificate     /pki/appb.chain.pem;
    ssl_certificate_key /pki/appb.key;
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_client_certificate /pki/clientca.pem;

    location = /enrich { default_type application/json; return 200 '{"profile":{"tier":"gold","since":2019}}'; }

    location = /callback {
      proxy_pass https://appa:9443/health;
      proxy_ssl_server_name on;
      proxy_ssl_name appa;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 2;
      proxy_ssl_trusted_certificate /pki/root-rsa.pem;
      proxy_ssl_certificate     /pki/appb.chain.pem;
      proxy_ssl_certificate_key /pki/appb.key;
      proxy_ssl_protocols TLSv1.3;
      proxy_ssl_conf_command Groups X25519;
    }
  }
}
