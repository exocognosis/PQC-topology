# Records store (origin of the "records" data class). TLS 1.3 with hybrid
# X25519MLKEM768 only and an ML-DSA-65 certificate: quantum-safe hop.
# The backend is a loopback-only HTTP service on the same host.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /run-out/error.log warn;
events { worker_connections 256; }
http {
  log_format tlsinfo '$time_iso8601 $remote_addr $server_port $ssl_protocol $ssl_cipher $ssl_curve $status "$request"';
  access_log /run-out/access.log tlsinfo;
  server {
    listen 7443 ssl;
    server_name data;
    ssl_certificate     /pki/data.chain.pem;
    ssl_certificate_key /pki/data.key;
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519MLKEM768;
    location / { proxy_pass http://127.0.0.1:8000; }
  }
}
