# Edge gateway. Internet-facing; offers hybrid and classical groups, so legacy
# clients negotiate X25519 while modern clients negotiate X25519MLKEM768.
# Upstream to lb uses TLS 1.2 with RSA key transport (Shor-vulnerable).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /run-out/error.log warn;
events { worker_connections 256; }
http {
  log_format tlsinfo '$time_iso8601 $remote_addr $server_port $ssl_protocol $ssl_cipher $ssl_curve $status "$request"';
  access_log /run-out/access.log tlsinfo;
  server {
    listen 443 ssl;
    server_name gw;
    ssl_certificate     /pki/gw.chain.pem;
    ssl_certificate_key /pki/gw.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305;
    location / {
      proxy_pass https://lb:8443;
      proxy_ssl_server_name on;
      proxy_ssl_name lb;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 2;
      proxy_ssl_trusted_certificate /pki/root-rsa.pem;
      proxy_ssl_protocols TLSv1.2;
      proxy_ssl_ciphers AES256-GCM-SHA384;
    }
  }
}
