# Application service A. Mutual TLS, TLS 1.3, X25519 only.
#   /records -> data (hybrid X25519MLKEM768, ML-DSA-65 server cert)
#   /enrich  -> appb (mTLS, X25519)
#   /cycle   -> appb /callback -> appa /health   (call cycle appa <-> appb)
worker_processes 1;
pid /tmp/nginx.pid;
error_log /run-out/error.log warn;
events { worker_connections 256; }
http {
  log_format tlsinfo '$time_iso8601 $remote_addr $server_port $ssl_protocol $ssl_cipher $ssl_curve $status "$request"';
  access_log /run-out/access.log tlsinfo;
  server {
    listen 9443 ssl;
    server_name appa;
    ssl_certificate     /pki/appa.chain.pem;
    ssl_certificate_key /pki/appa.key;
    ssl_protocols TLSv1.3;
    ssl_ecdh_curve X25519;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_client_certificate /pki/clientca.pem;

    location = /health { default_type application/json; return 200 '{"ok":true}'; }

    location /records {
      proxy_pass https://data:7443/records.json;
      proxy_ssl_server_name on;
      proxy_ssl_name data;
      proxy_ssl_verify on;
      proxy_ssl_trusted_certificate /pki/root-mldsa.pem;
      proxy_ssl_protocols TLSv1.3;
      proxy_ssl_conf_command Groups X25519MLKEM768;
    }
    location /enrich {
      proxy_pass https://appb:9444/enrich;
      proxy_ssl_server_name on;
      proxy_ssl_name appb;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 2;
      proxy_ssl_trusted_certificate /pki/root-rsa.pem;
      proxy_ssl_certificate     /pki/appa.chain.pem;
      proxy_ssl_certificate_key /pki/appa.key;
      proxy_ssl_protocols TLSv1.3;
      proxy_ssl_conf_command Groups X25519;
    }
    location /cycle {
      proxy_pass https://appb:9444/callback;
      proxy_ssl_server_name on;
      proxy_ssl_name appb;
      proxy_ssl_verify on;
      proxy_ssl_verify_depth 2;
      proxy_ssl_trusted_certificate /pki/root-rsa.pem;
      proxy_ssl_certificate     /pki/appa.chain.pem;
      proxy_ssl_certificate_key /pki/appa.key;
      proxy_ssl_protocols TLSv1.3;
      proxy_ssl_conf_command Groups X25519;
    }
  }
}
