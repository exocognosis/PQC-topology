name: Bug or wrong result
description: The scorer, probe, testbed or a proof does something it should not.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Command, input file (anonymized) and output.
      render: shell
  - type: input
    id: version
    attributes:
      label: Commit or release
